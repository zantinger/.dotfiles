set -g base-index 1
# set -g panel-base-index 1
set-window-option -g mode-keys vi

# Remap prefix to control-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind g select-window -t 1
bind f select-window -t 2
bind d select-window -t 3
bind s select-window -t 4

# turn mouse on
set -g mouse on

# Floating popup with nvim
bind v popup -E -w 80% -h 80% -d "#{pane_current_path}" "nvim"

# Cheatsheet popup
bind ? popup -E -w 60% -h 60% "cat ~/.dotfiles/cheatsheet.md | fzf --header='Keybindings Cheatsheet'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'light'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
